<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>考研英语精读器 · 完形填空逐题逐句</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="../../shared/subject-nav.css">
<script>if (location.protocol === "http:" && /^(127\.0\.0\.1|localhost)$/.test(location.hostname)) document.write("<script src=\"/api/bootstrap.js\"><\/script>");</script>
<script src="../../shared/study-storage.js"></script>
</head>
<body>

<!-- ============ 顶栏 ============ -->
<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v14.5H5.5A1.5 1.5 0 0 0 4 19z"/>
      <path d="M4 19v1.5A1.5 1.5 0 0 0 5.5 22H19v-4.5"/>
      <path d="M8 7.5h7M8 11h4.5"/>
    </svg>
    <span class="brand-t">考研英语精读器</span>
    <a class="home-link" href="../../index.html" title="返回三科主目录">← 返回主目录</a>
    <span class="brand-s">完形填空 · 逐题逐句</span>
  </div>

  <div class="tools">
    <div class="search-wrap">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
      </svg>
      <input id="search" type="search" placeholder="年份 / 主题…" autocomplete="off" spellcheck="false" aria-label="搜索年份或主题">
    </div>

    <button id="btn-zh" class="tbtn" type="button" title="显示 / 隐藏中文译文 (z)">中文</button>

    <div class="fs">
      <button id="fs-down" class="tbtn icon" type="button" title="缩小字号">A−</button>
      <button id="fs-up" class="tbtn icon" type="button" title="放大字号">A+</button>
    </div>

    <div class="seg" id="mode-seg" role="group" aria-label="模式">
      <button type="button" data-mode="study" class="on">精讲</button>
      <button type="button" data-mode="practice">做题</button>
    </div>

    <button id="btn-theme" class="tbtn icon" type="button" title="切换深浅色">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/>
      </svg>
    </button>

    <button id="btn-drawer" class="tbtn" type="button" title="生词本">
      生词本 <span id="wb-count" class="cnt">0</span>
    </button>
  </div>
</header>

<!-- ============ 三栏 ============ -->
<div class="layout">

  <!-- 左栏 -->
  <aside class="col col-left" aria-label="篇目导航">
    <div class="colhead">
      篇目
      <span class="spacer" id="year-count"></span>
    </div>
    <ul class="yearlist" id="yearlist"></ul>
    <div class="hints">
      <h4>快捷键</h4>
      <dl>
        <dt><kbd>j</kbd> / <kbd>k</kbd></dt><dd>下一个 / 上一个空位</dd>
        <dt><kbd>/</kbd></dt><dd>聚焦搜索</dd>
        <dt><kbd>z</kbd></dt><dd>中文译文开关</dd>
        <dt><kbd>Esc</kbd></dt><dd>关闭卡片 / 工具条</dd>
        <dt><kbd>Ctrl</kbd>+滚轮</dt><dd>缩放正文</dd>
      </dl>
    </div>
  </aside>

  <!-- 中栏 -->
  <section class="col col-mid" aria-label="原文阅读">
    <div class="dochead">
      <div class="dochead-in">
        <div class="doc-title">
          <span class="doc-year" id="doc-year">—</span>
          <span class="doc-meta" id="doc-meta"></span>
        </div>
        <p class="doc-topic" id="doc-topic"></p>
        <div class="doc-foot">
          <div class="seg" id="view-seg" role="group" aria-label="视图">
            <button type="button" data-view="text" class="on">原文</button>
            <button type="button" data-view="sentence">逐句精读</button>
          </div>
          <span class="spacer"></span>
          <span class="src" id="doc-src"></span>
        </div>
      </div>
    </div>
    <article class="reading" id="reading"></article>
  </section>

  <!-- 右栏 -->
  <aside class="col col-right" aria-label="解析面板">
    <div class="wordcard" id="wordcard" hidden></div>
    <div class="panel" id="panel"></div>
  </aside>

</div>

<!-- ============ 划词工具条 ============ -->
<div class="selbar" id="selbar" hidden role="toolbar" aria-label="划词工具条">
  <span class="sw" id="selbar-word">word</span>
  <button type="button" data-act="copy" title="复制单词，给划词翻译插件用">复制</button>
  <a href="#" data-act="youdao" target="_blank" rel="noopener noreferrer">有道</a>
  <a href="#" data-act="cambridge" target="_blank" rel="noopener noreferrer">剑桥</a>
  <button type="button" data-act="star" class="star" title="加入生词本">★ 生词本</button>
</div>

<!-- ============ 生词本抽屉 ============ -->
<aside class="drawer" id="drawer" hidden aria-label="生词本">
  <div class="dw-h">
    <h2>生词本</h2>
    <span class="cnt2" id="wb-cnt2">0 个词</span>
    <button type="button" class="x" id="dw-close" title="关闭 (Esc)">×</button>
  </div>
  <ul class="wb-list" id="wb-list"></ul>
  <div class="dw-f">
    <button type="button" class="mini pri" id="wb-copy">复制全部</button>
    <button type="button" class="mini" id="wb-csv">导出 CSV</button>
    <button type="button" class="mini danger" id="wb-clear">清空</button>
  </div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- ============ 数据（file:// 友好：script 注入，缺失静默） ============ -->
